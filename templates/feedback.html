{% extends "base.html" %}
{% block title %}Feedback · VoLoveTeer{% endblock %}
{% block content %}
<h1>How was {{ event.title }}?</h1>
<p>Your rating is anonymous in this prototype.</p>
<form method="post">
  {% for number in range(1,6) %}
  <label><input type="radio" name="rating" value="{{ number }}" required> {{ number }}{% if number == 1 %} — Not for me{% elif number == 5 %} — Loved it{% endif %}</label><br>
  {% endfor %}
  <p><button type="submit">Send feedback</button></p>
</form>
{% endblock %}
